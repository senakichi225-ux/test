<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>kerokero オフィス</title>
<style>
  :root {
    --cream: #fff7ec;
    --paper: #fffdf8;
    --main: #6dbb6a;
    --main-deep: #4a9a50;
    --gold: #e9b93c;
    --gold-deep: #c9961f;
    --ink: #4a3426;
    --ink-soft: #8a6e5a;
    --mint-deep: #4fae92;
    --shadow: 0 8px 24px rgba(90, 60, 30, .18);
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(circle at 30% 20%, #fff3e2, #f6dcc0 70%);
    color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; touch-action: none; }

  /* ---- 隅の小さな情報 ---- */
  #hud {
    position: fixed; left: 16px; bottom: 16px; z-index: 5;
    background: rgba(255, 253, 248, .94); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 12px 16px; min-width: 210px;
    border: 2px solid #dcefd2;
  }
  #hud .co { font-weight: 800; font-size: 15px; display: flex; align-items: center; gap: 6px; }
  #hud .date { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  #hud button {
    display: flex; align-items: baseline; gap: 6px; margin-top: 8px;
    background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; text-align: left;
  }
  #hud .count b { font-size: 28px; color: var(--main-deep); line-height: 1; }
  #hud .count span, #hud .plan span { font-size: 12px; color: var(--ink-soft); }
  #hud .plan b { color: var(--gold-deep); font-size: 15px; }
  #week { display: flex; gap: 6px; margin-top: 8px; }
  #week i {
    width: 14px; height: 14px; border-radius: 50%; background: #eadfd3;
    display: block; border: 2px solid #fff; box-shadow: 0 0 0 1px #e2d2c0;
  }
  #week i.on { background: var(--main); box-shadow: 0 0 0 1px var(--main-deep); }
  #week i.today { outline: 2px dashed var(--mint-deep); outline-offset: 2px; }
  #hint {
    position: fixed; right: 16px; bottom: 16px; z-index: 5; font-size: 12px;
    color: var(--ink-soft); background: rgba(255,253,248,.8); padding: 6px 10px; border-radius: 999px;
  }
  @media (max-width: 600px) { #hint { top: 16px; bottom: auto; } }

  /* ---- 名札と吹き出し ---- */
  .tag {
    position: fixed; z-index: 4; transform: translate(-50%, -100%); pointer-events: none;
    white-space: nowrap; transition: opacity .25s;
  }
  .nametag {
    color: #fff; font-weight: 800; font-size: 11px;
    padding: 3px 9px; border-radius: 999px; border: 2px solid #fff; box-shadow: var(--shadow);
    text-shadow: 0 1px 2px rgba(0, 0, 0, .45);
  }
  .bubble {
    background: #fff; color: var(--ink); font-weight: 700; font-size: 13px;
    padding: 7px 12px; border-radius: 14px; box-shadow: var(--shadow);
    transform: translate(10%, -100%);
    white-space: normal; width: max-content; max-width: min(300px, 60vw);
  }
  .bubble::after {
    content: ""; position: absolute; left: 14px; bottom: -8px;
    border: 8px solid transparent; border-top-color: #fff; border-bottom: 0;
  }
  .bubble.flip { transform: translate(-90%, -100%); }
  .bubble.flip::after { left: auto; right: 14px; }

  /* ---- ポップアップ ---- */
  .modal {
    position: fixed; inset: 0; z-index: 10; display: none;
    align-items: center; justify-content: center; padding: 16px;
    background: rgba(74, 52, 38, .28);
  }
  .modal.open { display: flex; }
  .panel {
    background: var(--paper); border-radius: 22px; box-shadow: var(--shadow);
    width: min(520px, 100%); max-height: calc(100vh - 32px); overflow: auto;
    padding: 20px; position: relative; border: 3px solid #dcefd2;
  }
  .close {
    position: absolute; top: 10px; right: 12px; border: 0; background: #eef6e9;
    width: 32px; height: 32px; border-radius: 50%; font-size: 18px; cursor: pointer; color: var(--ink);
  }
  .panel h2 { margin: 0 0 12px; font-size: 18px; display: flex; gap: 8px; align-items: center; }
  .cards { display: grid; gap: 10px; }
  .card {
    display: grid; grid-template-columns: 48px 1fr; gap: 12px; align-items: center;
    background: #fff; border-radius: 14px; padding: 12px; border: 2px solid #e8efe2;
  }
  .card .ic {
    width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center;
    font-size: 26px; background: var(--cream);
  }
  .card .hl { font-weight: 800; font-size: 15px; line-height: 1.35; }
  .card .src { font-size: 12px; color: var(--mint-deep); text-decoration: none; word-break: break-all; }
  .card a.src:hover { text-decoration: underline; }
  .empty { text-align: center; padding: 18px 8px; color: var(--ink-soft); font-weight: 700; }
  .btn {
    display: block; width: 100%; margin-top: 14px; text-align: center; text-decoration: none;
    background: var(--main); color: #fff; font-weight: 800; padding: 12px; border-radius: 14px;
    border: 0; font-size: 15px; font-family: inherit; cursor: pointer;
  }
  .btn:hover { background: var(--main-deep); }
  .btn.gold { background: var(--gold); }
  .btn.gold:hover { background: var(--gold-deep); }

  /* 社員証 */
  .idcard { padding: 0; overflow: hidden; width: min(380px, 100%); }
  .idcard .band {
    background: linear-gradient(135deg, var(--main), #b5e3a1); color: #fff;
    padding: 12px 18px; font-weight: 800; font-size: 13px; letter-spacing: .05em;
  }
  .idcard .body { padding: 18px; display: grid; grid-template-columns: 96px 1fr; gap: 16px; align-items: center; }
  .idcard .face { width: 96px; height: 96px; border-radius: 18px; background: #eef6e9; display: grid; place-items: center; }
  .idcard .name { font-size: 21px; font-weight: 800; }
  .idcard dl { margin: 6px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 13px; }
  .idcard dt { color: var(--ink-soft); }
  .idcard dd { margin: 0; font-weight: 700; }
  .idcard .state {
    margin: 0 18px 18px; padding: 10px; border-radius: 12px; text-align: center;
    font-weight: 800; background: #eaf7f2; color: var(--mint-deep);
  }
  .idcard .btn { width: auto; margin: -6px 18px 18px; }

  /* ---- 3Dが使えないとき ---- */
  #fallback {
    display: none; position: fixed; inset: 0; z-index: 3; overflow: auto;
    padding: 24px 16px 200px;
  }
  body.no3d #fallback { display: block; }
  body.no3d #hint { display: none; }
  #fallback .wrap { max-width: 560px; margin: 0 auto; }
  #fallback h3 { margin: 20px 0 10px; font-size: 15px; }
  #fallback .big { font-size: 40px; font-weight: 800; color: var(--main-deep); line-height: 1; }
  #fallback .staff { display: flex; flex-wrap: wrap; gap: 6px; }
  #fallback .staff span { background: #fff; border: 2px solid #e8efe2; border-radius: 999px; padding: 4px 10px; font-size: 12px; }
  #fallback .note { font-size: 12px; color: var(--ink-soft); margin-top: 12px; }
</style>

<div id="stage" aria-label="3Dオフィス"></div>

<!-- 3Dが読み込めないときの簡易表示 -->
<div id="fallback">
  <div class="wrap">
    <div style="font-weight:800" id="fb-co"></div>
    <h3>🔎 今日のリサーチ <span class="big" id="fb-count">0</span> <span id="fb-label">件</span></h3>
    <div class="cards" id="fb-cards"></div>
    <a class="btn" id="fb-report" href="#">報告ファイルを開く</a>
    <h3>💡 今月の企画</h3>

    <a class="btn gold" id="fb-plan-file" href="#">企画ファイルを開く</a>
    <h3>🐸 社員</h3>
    <div class="staff" id="fb-staff"></div>
    <div class="note">3D表示を読み込めなかったため、簡易表示にしています（インターネット接続を確認してください）。</div>
  </div>
</div>

<div id="hud">
  <div class="co">🐸 <span id="hud-co"></span></div>
  <div class="date" id="hud-date"></div>
  <button class="count" id="hud-count" type="button" title="今日のリサーチを見る">🔎 <b id="hud-num">0</b><span id="hud-label">件</span></button>
  <div id="week" aria-label="直近7日のリサーチ出勤"></div>
  <button class="plan" id="hud-plan" type="button" title="今月の企画を見る">💡 <span>今月の企画</span> <b id="hud-plan-num">0</b><span id="hud-plan-label">案</span></button>
</div>
<div id="hint">🖱 ドラッグで回転・ホイールで拡大</div>
<div id="tags"></div>

<div class="modal" id="news-modal" role="dialog" aria-modal="true">
  <div class="panel">
    <button class="close" data-close aria-label="閉じる">×</button>
    <h2 id="news-title">🔎 今日のリサーチ</h2>
    <div class="cards" id="news-cards"></div>
    <a class="btn" id="news-report" href="#">📂 報告ファイルを開く</a>
  </div>
</div>

<div class="modal" id="plan-modal" role="dialog" aria-modal="true">
  <div class="panel">
    <button class="close" data-close aria-label="閉じる">×</button>
    <h2 id="plan-title">💡 今月の企画</h2>
    <div class="cards" id="plan-cards"></div>
    <a class="btn gold" id="plan-file" href="#">📂 企画ファイルを開く</a>
  </div>
</div>

<div class="modal" id="id-modal" role="dialog" aria-modal="true">
  <div class="panel idcard">
    <button class="close" data-close aria-label="閉じる" style="background:rgba(255,255,255,.6)">×</button>
    <div class="band" id="id-co">社員証</div>
    <div class="body">
      <div class="face" id="id-face"></div>
      <div>
        <div class="name" id="id-name"></div>
        <dl>
          <dt>仕事</dt><dd id="id-role"></dd>
          <dt>勤務</dt><dd id="id-hours"></dd>
          <dt>見た目</dt><dd id="id-look"></dd>
        </dl>
      </div>
    </div>
    <div class="state" id="id-state"></div>
    <a class="btn" id="id-file" href="#">📂 最新の仕事を開く</a>
  </div>
</div>

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/controls/OrbitControls.min.js"></script>
<script>
(function () {
  "use strict";

  /* ================= データと日付 ================= */
  function readJson(id) { try { return JSON.parse(document.getElementById(id).textContent) || {}; } catch (e) { return {}; } }
  var NEWS = readJson("news-data"), PLANS = readJson("plans-data"), STAFF = readJson("staff-data");
  var days = Array.isArray(NEWS.days) ? NEWS.days : [];
  var staff = Array.isArray(STAFF.staff) ? STAFF.staff : [];
  var companyName = STAFF.company || NEWS.company || "kerokero";

  var params = new URLSearchParams(location.search);
  // 日本時間の「今」。?hour=18 や ?date=2026-11-01 を付けると見た目を試せる
  function jstNow() {
    var d = new Date(Date.now() + 9 * 3600 * 1000);
    if (params.has("hour")) d.setUTCHours(Number(params.get("hour")) || 0);
    return d;
  }
  function ymd(d) {
    return d.getUTCFullYear() + "-" + String(d.getUTCMonth() + 1).padStart(2, "0") + "-" + String(d.getUTCDate()).padStart(2, "0");
  }
  var todayStr = params.get("date") || ymd(jstNow());
  var monthStr = todayStr.slice(0, 7);

  // リサーチ（毎朝）：reported / no_news / search_failed / before（出社前）
  var today = null;
  days.forEach(function (d) { if (d.date === todayStr) today = d; });
  var state = today ? today.status : "before";
  var items = (today && Array.isArray(today.items)) ? today.items : [];
  var count = items.length;
  var reportFile = today && today.report_file ? today.report_file : ("報告/" + todayStr + "_ふすまリサーチ.md");

  // 企画（毎月）：proposed / failed / before（今月まだ）
  var plan = null;

    bulb.material.color.set(P.lamp > 0 ? 0xffe2a0 : 0xfff6e6);
    document.body.style.background = name === "night"
      ? "radial-gradient(circle at 30% 20%, #4a4f78, #262a48 70%)"
      : name === "evening" ? "radial-gradient(circle at 30% 20%, #ffe3cc, #f2b99a 70%)"
      : "radial-gradient(circle at 30% 20%, #fff3e2, #f6dcc0 70%)";
  }
  function updateClock() {
    var n = jstNow();
    var hh = n.getUTCHours(), mm = n.getUTCMinutes(), ss = n.getUTCSeconds() + n.getUTCMilliseconds() / 1000;
    secHand.rotation.z = -ss / 60 * Math.PI * 2;
    minHand.rotation.z = -(mm + ss / 60) / 60 * Math.PI * 2;
    hourHand.rotation.z = -((hh % 12) + mm / 60) / 12 * Math.PI * 2;
    applyPhase(phaseOf(hh));
  }

  /* ---- 操作（ドラッグで回転・ホイールで拡大・自動でゆっくり回る） ---- */
  var controls = null, idleUntil = 0, sph = null;
  if (THREE.OrbitControls) {
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.copy(TARGET);
    controls.enableDamping = true; controls.dampingFactor = 0.08;
    controls.enablePan = false;
    controls.minDistance = 8; controls.maxDistance = Math.max(34, fitDistance() * 1.5);
    controls.minPolarAngle = 0.25; controls.maxPolarAngle = 1.3;
    controls.autoRotate = true; controls.autoRotateSpeed = 0.5;
    controls.addEventListener("start", function () { controls.autoRotate = false; idleUntil = Infinity; });
    controls.addEventListener("end", function () { idleUntil = performance.now() + 5000; });
    controls.update();
  } else {
    // OrbitControls が読み込めなかったときの簡易操作（同じ動き）
    sph = new THREE.Spherical().setFromVector3(camera.position.clone().sub(TARGET));
    var dragging = false, lx = 0, ly = 0;
    renderer.domElement.addEventListener("pointerdown", function (e) { dragging = true; lx = e.clientX; ly = e.clientY; idleUntil = Infinity; });
    window.addEventListener("pointerup", function () { if (dragging) { dragging = false; idleUntil = performance.now() + 5000; } });
    window.addEventListener("pointermove", function (e) {
      if (!dragging) return;
      sph.theta -= (e.clientX - lx) * 0.008; sph.phi -= (e.clientY - ly) * 0.008; lx = e.clientX; ly = e.clientY;
      sph.phi = Math.max(0.25, Math.min(1.3, sph.phi));
    });
    renderer.domElement.addEventListener("wheel", function (e) {
      e.preventDefault(); sph.radius = Math.max(8, Math.min(Math.max(34, fitDistance() * 1.5), sph.radius * (1 + Math.sign(e.deltaY) * 0.08)));
    }, { passive: false });
    controls = {
      update: function () {
        if (!dragging && performance.now() > idleUntil) sph.theta += 0.0012;
        camera.position.copy(new THREE.Vector3().setFromSpherical(sph).add(TARGET)); camera.lookAt(TARGET);
      }
    };
  }

  /* ---- クリック ---- */
  var ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), downAt = null, hovered = null;
  function pick(e) {
    var r = renderer.domElement.getBoundingClientRect();
    ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1; ndc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
    ray.setFromCamera(ndc, camera);
    var hits = ray.intersectObjects(clickables.filter(function (o) {
      var v = true; o.traverseAncestors(function (a) { if (!a.visible) v = false; });
      return v && (o.visible || o === trayHit || o === folderHit);
    }), false);
    return hits.length ? hits[0].object.userData.action : null;
  }
  renderer.domElement.addEventListener("pointerdown", function (e) { downAt = { x: e.clientX, y: e.clientY }; });
  renderer.domElement.addEventListener("pointerup", function (e) {
    if (!downAt || Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 6) return;
    var act = pick(e);
    if (act === "news") openModal("news-modal");
    if (act === "plans") openModal("plan-modal");
    if (act && act.indexOf("id:") === 0) showId(Number(act.slice(3)));
  });
  renderer.domElement.addEventListener("pointermove", function (e) {
    hovered = pick(e);
    renderer.domElement.style.cursor = hovered ? "pointer" : "grab";
  });

  /* ---- 名札・吹き出しの位置 ---- */
  var tmp = new THREE.Vector3();
  function placeTag(el, obj, show, above) {
    if (!show) { el.style.opacity = "0"; return; }
    obj.getWorldPosition(tmp); tmp.y += 0.85; tmp.project(camera);
    if (tmp.z > 1) { el.style.opacity = "0"; return; }
    var x = (tmp.x + 1) / 2 * window.innerWidth;
    el.style.left = x + "px";
    el.style.top = ((1 - tmp.y) / 2 * window.innerHeight - (above ? above.offsetHeight + 8 : 0)) + "px";
    el.style.opacity = "1";
    if (above) el.classList.toggle("flip", x + el.offsetWidth * 1.1 > window.innerWidth - 8);
  }

  /* ---- 動き ---- */
  var clockT = new THREE.Clock();
  function animate() {
    requestAnimationFrame(animate);
    var t = clockT.getElapsedTime();

    if (controls.autoRotate === false && performance.now() > idleUntil) controls.autoRotate = true;
    controls.update();

    // 視点が壁の外側に回ったら、その壁を隠して中が見えるようにする
    backWall.visible = camera.position.z > -D / 2 + 0.5;
    leftWall.visible = camera.position.x > -W / 2 + 0.5;

    var speakerNow = speakers.length ? speakers[Math.floor(t / 4) % speakers.length] : null;
    members.forEach(function (m) {
      var F = m.F, ph = m.phase;
      if (!F.group.visible) return;
      if (m.speed) {
        F.arms[0].rotation.x = -1.15 + Math.sin(t * m.speed + ph) * 0.09;
        F.arms[1].rotation.x = -1.15 + Math.sin(t * m.speed + ph + Math.PI) * 0.09;
      } else {
        F.arms[0].rotation.x = F.arms[1].rotation.x = -0.9;
      }
      if (m.mode === "trouble") {
        F.head.rotation.z = 0.18 + Math.sin(t * 1.2) * 0.04; F.head.rotation.x = 0.12;
        F.sweat.position.y = 0.25 - (t * 0.25 % 0.2);
      } else {
        F.head.rotation.z = Math.sin(t * (m.mode === "idle" ? 0.7 : 1.4) + ph) * 0.06;
        F.head.rotation.x = Math.sin(t * 0.8 + ph) * 0.03 + 0.04;
      }
      F.torso.position.y = Math.abs(Math.sin(t * ((m.speed || 3) / 2) + ph)) * 0.014;
      var puff = 1 + Math.max(0, Math.sin(t * (m.mode === "trouble" ? 1.5 : 2.6) + ph)) * 0.18;
      F.throat.scale.set(1.1 * puff, 0.7 * puff, 0.8 * puff);
      if (t > m.nextBlink) { m.blinkEnd = t + 0.13; m.nextBlink = t + 2.2 + Math.random() * 3; }
      F.eyes[0].scale.y = F.eyes[1].scale.y = t < m.blinkEnd ? 0.12 : 1;
      if (m.idea) {
        m.idea.position.y = 0.6 + Math.sin(t * 2.2) * 0.05;
        m.idea.children[0].material.color.setHSL(0.14, 1, 0.62 + Math.sin(t * 3) * 0.08);
      }
    });
    if (marker.children.length) {
      marker.position.y = 1.45 + count * 0.07 + Math.sin(t * 3) * 0.06;
      marker.rotation.y = t * 1.5;
    }
    paperMat.emissive.setHex(hovered === "news" ? 0x332211 : 0x000000);
    plants.forEach(function (p, idx) { p.rotation.z = Math.sin(t * 0.9 + idx) * 0.015; });

    updateClock();
    renderer.render(scene, camera);
    members.forEach(function (m) {
      placeTag(m.tag, m.F.head, m.F.group.visible);
      placeTag(m.bub, m.F.head, m.F.group.visible && m === speakerNow, m.tag);
    });
  }
  animate();

  window.addEventListener("resize", function () {
    camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    if (controls.object) { controls.maxDistance = Math.max(34, fitDistance() * 1.5); camera.position.sub(controls.target).setLength(fitDistance()).add(controls.target); }
    else if (sph) sph.radius = fitDistance();
  });
})();
</script>
</body>
</html>
