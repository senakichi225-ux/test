<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>たなかAIカンパニー オフィス</title>
<style>
  :root {
    --cream: #fff7ec;
    --paper: #fffdf8;
    --main: #6dbb6a;
    --main-deep: #4a9a50;
    --ink: #4a3426;
    --ink-soft: #8a6e5a;
    --mint: #8fd4bd;
    --mint-deep: #4fae92;
    --rose: #f4a7a0;
    --sky: #9fd6f5;
    --shadow: 0 8px 24px rgba(90, 60, 30, .18);
    --radius: 18px;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(circle at 30% 20%, #fff3e2, #f6dcc0 70%);
    color: var(--ink);
    font-family: "Hiragino Maru Gothic ProN", "Hiragino Sans", "Yu Gothic UI", "Yu Gothic", "Meiryo", system-ui, sans-serif;
  }
  #stage { position: fixed; inset: 0; }
  #stage canvas { display: block; touch-action: none; }

  /* ---- 隅の小さな情報 ---- */
  #hud {
    position: fixed; left: 16px; bottom: 16px; z-index: 5;
    background: rgba(255, 253, 248, .92); border-radius: var(--radius);
    box-shadow: var(--shadow); padding: 12px 16px; min-width: 200px;
    border: 2px solid #f3dcc2;
  }
  #hud .co { font-weight: 800; font-size: 15px; display: flex; align-items: center; gap: 6px; }
  #hud .date { font-size: 12px; color: var(--ink-soft); margin-top: 2px; }
  #hud .count {
    margin-top: 8px; display: flex; align-items: baseline; gap: 6px;
    background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer;
  }
  #hud .count b { font-size: 30px; color: var(--main-deep); line-height: 1; }
  #hud .count span { font-size: 12px; color: var(--ink-soft); }
  #week { display: flex; gap: 6px; margin-top: 8px; }
  #week i {
    width: 14px; height: 14px; border-radius: 50%; background: #eadfd3;
    display: block; border: 2px solid #fff; box-shadow: 0 0 0 1px #e2d2c0;
  }
  #week i.on { background: var(--main); box-shadow: 0 0 0 1px var(--main-deep); }
  #week i.today { outline: 2px dashed var(--mint-deep); outline-offset: 2px; }
  #hint {
    position: fixed; right: 16px; bottom: 16px; z-index: 5; font-size: 12px;
    color: var(--ink-soft); background: rgba(255,253,248,.8); padding: 6px 10px; border-radius: 999px;
  }

  /* ---- 名札と吹き出し ---- */
  .tag {
    position: fixed; z-index: 4; transform: translate(-50%, -100%); pointer-events: none;
    white-space: nowrap; transition: opacity .2s;
  }
  #nametag {
    background: var(--main); color: #fff; font-weight: 800; font-size: 13px;
    padding: 4px 12px; border-radius: 999px; border: 2px solid #fff; box-shadow: var(--shadow);
  }
  #bubble {
    background: #fff; color: var(--ink); font-weight: 700; font-size: 14px;
    padding: 8px 14px; border-radius: 16px; box-shadow: var(--shadow);
    transform: translate(10%, -100%);
    white-space: normal; width: max-content; max-width: min(320px, 60vw);
  }
  #bubble.flip { transform: translate(-90%, -100%); }
  #bubble.flip::after { left: auto; right: 14px; }
  #bubble::after {
    content: ""; position: absolute; left: 14px; bottom: -8px;
    border: 8px solid transparent; border-top-color: #fff; border-bottom: 0;
  }

  /* ---- ポップアップ（ニュースカード・社員証） ---- */
  .modal {
    position: fixed; inset: 0; z-index: 10; display: none;
    align-items: center; justify-content: center; padding: 16px;
    background: rgba(74, 52, 38, .28);
  }
  .modal.open { display: flex; }
  .panel {
    background: var(--paper); border-radius: 22px; box-shadow: var(--shadow);
    width: min(520px, 100%); max-height: calc(100vh - 32px); overflow: auto;
    padding: 20px; position: relative; border: 3px solid #f3dcc2;
  }
  .close {
    position: absolute; top: 10px; right: 12px; border: 0; background: #f6e8d8;
    width: 32px; height: 32px; border-radius: 50%; font-size: 18px; cursor: pointer; color: var(--ink);
  }
  .panel h2 { margin: 0 0 12px; font-size: 18px; display: flex; gap: 8px; align-items: center; }
  .cards { display: grid; gap: 10px; }
  .card {
    display: grid; grid-template-columns: 48px 1fr; gap: 12px; align-items: center;
    background: #fff; border-radius: 14px; padding: 12px; border: 2px solid #f1e2d2;
  }
  .card .ic {
    width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center;
    font-size: 26px; background: var(--cream);
  }
  .card .hl { font-weight: 800; font-size: 15px; line-height: 1.35; }
  .card a.src { font-size: 12px; color: var(--mint-deep); text-decoration: none; word-break: break-all; }
  .card a.src:hover { text-decoration: underline; }
  .empty { text-align: center; padding: 18px 8px; color: var(--ink-soft); font-weight: 700; }
  .btn {
    display: block; width: 100%; margin-top: 14px; text-align: center; text-decoration: none;
    background: var(--main); color: #fff; font-weight: 800; padding: 12px; border-radius: 14px;
    border: 0; font-size: 15px; font-family: inherit; cursor: pointer;
  }
  .btn:hover { background: var(--main-deep); }

  /* 社員証 */
  .idcard { padding: 0; overflow: hidden; width: min(360px, 100%); }
  .idcard .band {
    background: linear-gradient(135deg, var(--main), #b5e3a1); color: #fff;
    padding: 12px 18px; font-weight: 800; font-size: 13px; letter-spacing: .05em;
  }
  .idcard .body { padding: 18px; display: grid; grid-template-columns: 96px 1fr; gap: 16px; align-items: center; }
  .idcard .face { width: 96px; height: 96px; border-radius: 18px; background: #fdebd6; display: grid; place-items: center; }
  .idcard .name { font-size: 22px; font-weight: 800; }
  .idcard dl { margin: 6px 0 0; display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; font-size: 13px; }
  .idcard dt { color: var(--ink-soft); }
  .idcard dd { margin: 0; font-weight: 700; }
  .idcard .state {
    margin: 0 18px 18px; padding: 10px; border-radius: 12px; text-align: center;
    font-weight: 800; background: #eaf7f2; color: var(--mint-deep);
  }

  /* ---- 3Dが使えないとき ---- */
  #fallback {
    display: none; position: fixed; inset: 0; z-index: 3; overflow: auto;
    padding: 24px 16px 140px;
  }
  body.no3d #fallback { display: block; }
  body.no3d #hint { display: none; }
  @media (max-width: 600px) { #hint { top: 16px; bottom: auto; } }
  #fallback .wrap { max-width: 560px; margin: 0 auto; }
  #fallback .top { display: flex; align-items: center; gap: 14px; margin-bottom: 16px; }
  #fallback .big { font-size: 44px; font-weight: 800; color: var(--main-deep); line-height: 1; }
  #fallback .note { font-size: 12px; color: var(--ink-soft); margin-top: 12px; }
</style>
</head>
<body>

<div id="stage" aria-label="3Dオフィス"></div>

<!-- 3Dが読み込めないときの簡易表示 -->
<div id="fallback">
  <div class="wrap">
    <div class="top">
      <div class="face-mini"></div>
      <div>
        <div style="font-weight:800" id="fb-co"></div>
        <div><span class="big" id="fb-count">0</span> <span id="fb-label">件</span></div>
      </div>
    </div>
    <div class="cards" id="fb-cards"></div>
    <a class="btn" id="fb-report" href="#">報告ファイルを開く</a>
    <div class="note">3D表示を読み込めなかったため、簡易表示にしています（インターネット接続を確認してください）。</div>
  </div>
</div>

<div id="hud">
  <div class="co">🐾 <span id="hud-co"></span></div>
  <div class="date" id="hud-date"></div>
  <button class="count" id="hud-count" type="button" title="今日のニュースを見る"><b id="hud-num">0</b><span id="hud-label">件</span></button>
  <div id="week" aria-label="直近7日の出勤"></div>
</div>
<div id="hint">🖱 ドラッグで回転・ホイールで拡大</div>

<div class="tag" id="nametag">ニュースくん</div>
<div class="tag" id="bubble"></div>

<div class="modal" id="news-modal" role="dialog" aria-modal="true">
  <div class="panel">
    <button class="close" data-close aria-label="閉じる">×</button>
    <h2 id="news-title">📄 今日の報告</h2>
    <div class="cards" id="news-cards"></div>
    <a class="btn" id="news-report" href="#">📂 報告ファイルを開く</a>
  </div>
</div>

<div class="modal" id="id-modal" role="dialog" aria-modal="true">
  <div class="panel idcard">
    <button class="close" data-close aria-label="閉じる" style="background:rgba(255,255,255,.6)">×</button>
    <div class="band" id="id-co">社員証</div>
    <div class="body">
      <div class="face" id="id-face"></div>
      <div>
        <div class="name" id="id-name"></div>
        <dl>
          <dt>仕事</dt><dd id="id-role"></dd>
          <dt>勤務</dt><dd id="id-hours"></dd>
          <dt>見た目</dt><dd id="id-look"></dd>
        </dl>
      </div>
    </div>
    <div class="state" id="id-state"></div>
  </div>
</div>

<!--
  ニュースと出勤の記録。data/news.json と全く同じ内容をここに入れる。
  （ダブルクリックで開いたときにも読めるよう、HTMLの中に埋め込んでいる）
-->

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/examples/js/controls/OrbitControls.min.js"></script>
<script>
(function () {
  "use strict";

  /* ================= データと日付 ================= */
  var DATA = {};
  try { DATA = JSON.parse(document.getElementById("news-data").textContent); } catch (e) { DATA = {}; }
  var days = Array.isArray(DATA.days) ? DATA.days : [];
  var emp = DATA.employee || { name: "ニュースくん", role: "AIニュース担当", look: "サングラスをかけたカエル", hours: "毎朝7:00（日本時間）" };
  var companyName = DATA.company || "たなかAIカンパニー";

  var params = new URLSearchParams(location.search);
  // 日本時間の「今」。?hour=18 のように指定すると時間帯の見た目を試せる
  function jstNow() {
    var d = new Date(Date.now() + 9 * 3600 * 1000);
    if (params.has("hour")) d.setUTCHours(Number(params.get("hour")) || 0);
    return d;
  }
  function ymd(d) {
    return d.getUTCFullYear() + "-" + String(d.getUTCMonth() + 1).padStart(2, "0") + "-" + String(d.getUTCDate()).padStart(2, "0");
  }
  var todayStr = params.get("date") || ymd(jstNow());
  var today = null;
  for (var i = 0; i < days.length; i++) if (days[i].date === todayStr) { today = days[i]; break; }
  // state: reported / no_news / search_failed / before（出社前）
  var state = today ? today.status : "before";
  var items = (today && Array.isArray(today.items)) ? today.items : [];
  var count = items.length;
  var reportFile = today && today.report_file ? today.report_file : ("報告/" + todayStr + "_AIニュース.md");

  var ICONS = { "ChatGPT": "💬", "Claude": "🤖", "画像生成": "🎨", "仕事効率化": "⚡", "その他": "📰" };
  var STATE_TEXT = {
    reported: "出勤済み・" + count + "件報告",
    no_news: "出勤済み・異常なし",
    search_failed: "出勤済み・検索できず困り中",
    before: "出社前"
  };
  var SPEECH = {
    reported: "社長！今日は" + count + "件です！",
    no_news: "社長、今日は異常なしです！",
    search_failed: "社長、すみません…今日は調べられませんでした",
    before: ""
  };
  var speech = (today && today.speech) || SPEECH[state] || "";

  /* ================= 画面の文字（HUD・カード・社員証） ================= */
  var $ = function (id) { return document.getElementById(id); };
  var WD = ["日", "月", "火", "水", "木", "金", "土"];
  var td = new Date(todayStr + "T00:00:00Z");
  $("hud-co").textContent = companyName;
  $("hud-date").textContent = todayStr.replace(/-/g, "/") + "（" + WD[td.getUTCDay()] + "）";
  var countLabel = state === "before" ? "件・出社前" : state === "search_failed" ? "件・検索できず" : state === "no_news" ? "件・異常なし" : "件";
  $("hud-num").textContent = count;
  $("hud-label").textContent = countLabel;

  // 直近7日の出勤（出社した日だけ色が付く）
  var attended = {};
  days.forEach(function (d) { attended[d.date] = true; });
  for (var k = 6; k >= 0; k--) {
    var dd = new Date(td.getTime() - k * 86400000);
    var ds = ymd(dd);
    var dot = document.createElement("i");
    if (attended[ds]) dot.className = "on";
    if (k === 0) dot.className += " today";
    dot.title = ds.slice(5).replace("-", "/") + (attended[ds] ? " 出勤" : " -");
    $("week").appendChild(dot);
  }

  function esc(s) { return String(s == null ? "" : s).replace(/[&<>"']/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]; }); }
  function safeUrl(u) { return /^https?:\/\//.test(u || "") ? u : "#"; }
  function cardsHtml() {
    if (!count) {
      var msg = state === "before" ? "まだ出社前です。朝7時の報告をお待ちください。"
        : state === "search_failed" ? "今日は検索がうまくいきませんでした。"
        : "今日は報告するニュースはありませんでした（異常なし）。";
      return '<div class="empty">' + esc(msg) + "</div>";
    }
    return items.map(function (it) {
      return '<div class="card"><div class="ic">' + (ICONS[it.category] || "📰") + '</div><div>' +
        '<div class="hl">' + esc(it.headline) + '</div>' +
        '<a class="src" href="' + esc(safeUrl(it.url)) + '" target="_blank" rel="noopener">出典：' + esc(it.source) + " ↗</a>" +
        "</div></div>";
    }).join("");
  }
  $("news-title").textContent = "📄 今日の報告 " + count + "件";
  $("news-cards").innerHTML = cardsHtml();
  $("news-report").href = encodeURI(reportFile);
  $("news-report").style.display = state === "before" ? "none" : "";

  // 3Dなしの簡易表示
  $("fb-co").textContent = companyName + "　" + todayStr.replace(/-/g, "/");
  $("fb-count").textContent = count;
  $("fb-label").textContent = countLabel;
  $("fb-cards").innerHTML = cardsHtml();
  $("fb-report").href = encodeURI(reportFile);
  $("fb-report").style.display = state === "before" ? "none" : "";

  // 社員証
  var faceSvg =
    '<svg viewBox="0 0 100 100" width="84" height="84" aria-hidden="true">' +
    '<ellipse cx="50" cy="62" rx="40" ry="28" fill="#7cc576"/>' +
    '<circle cx="31" cy="36" r="16" fill="#7cc576"/><circle cx="69" cy="36" r="16" fill="#7cc576"/>' +
    '<circle cx="31" cy="37" r="11" fill="#fff"/><circle cx="69" cy="37" r="11" fill="#fff"/>' +
    '<circle cx="32" cy="38" r="5.5" fill="#2f3a2c"/><circle cx="70" cy="38" r="5.5" fill="#2f3a2c"/>' +
    '<circle cx="31" cy="37" r="13" fill="#1b2a33" fill-opacity=".85" stroke="#1f2328" stroke-width="3"/><circle cx="69" cy="37" r="13" fill="#1b2a33" fill-opacity=".85" stroke="#1f2328" stroke-width="3"/>' +
    '<path d="M44 35 H56" stroke="#1f2328" stroke-width="3.5"/>' +
    '<path d="M35 30 L31 38 M73 30 L69 38" stroke="#fff" stroke-opacity=".7" stroke-width="2.5" stroke-linecap="round"/>' +
    '<ellipse cx="22" cy="64" rx="6" ry="3.5" fill="#f6a6a0"/><ellipse cx="78" cy="64" rx="6" ry="3.5" fill="#f6a6a0"/>' +
    '<circle cx="45" cy="54" r="1.6" fill="#2f3a2c"/><circle cx="55" cy="54" r="1.6" fill="#2f3a2c"/>' +
    '<path d="M30 63 Q50 76 70 63" fill="none" stroke="#2f3a2c" stroke-width="2.8" stroke-linecap="round"/>' +
    "</svg>";
  $("id-co").textContent = companyName + "　社員証";
  $("id-face").innerHTML = faceSvg;
  $("id-name").textContent = emp.name;
  $("id-role").textContent = emp.role;
  $("id-hours").textContent = emp.hours;
  $("id-look").textContent = emp.look;
  $("id-state").textContent = "今日：" + STATE_TEXT[state];
  if (state === "before") { $("id-state").style.background = "#f3ece4"; $("id-state").style.color = "#8a6e5a"; }
  if (state === "search_failed") { $("id-state").style.background = "#fdeceb"; $("id-state").style.color = "#c0605a"; }
  var faceMini = document.querySelector(".face-mini");
  if (faceMini) faceMini.innerHTML = faceSvg;

  function openModal(id) { $(id).classList.add("open"); }
  document.querySelectorAll(".modal").forEach(function (m) {
    m.addEventListener("click", function (e) { if (e.target === m || e.target.hasAttribute("data-close")) m.classList.remove("open"); });
  });
  document.addEventListener("keydown", function (e) {
    if (e.key === "Escape") document.querySelectorAll(".modal.open").forEach(function (m) { m.classList.remove("open"); });
  });
  $("hud-count").addEventListener("click", function () { openModal("news-modal"); });

  var nametag = $("nametag"), bubble = $("bubble");
  nametag.style.opacity = "0"; bubble.style.opacity = "0";
  bubble.textContent = speech;

  /* ================= 3D ================= */
  if (typeof THREE === "undefined") { document.body.classList.add("no3d"); return; }
  var renderer;
  try {
    renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
  } catch (e) { document.body.classList.add("no3d"); return; }

  var stage = $("stage");
  renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
  renderer.setSize(window.innerWidth, window.innerHeight);
  renderer.shadowMap.enabled = true;
  renderer.shadowMap.type = THREE.PCFSoftShadowMap;
  stage.appendChild(renderer.domElement);

  var scene = new THREE.Scene();
  var camera = new THREE.PerspectiveCamera(34, window.innerWidth / window.innerHeight, 0.1, 200);
  var TARGET = new THREE.Vector3(0, 1.2, -0.6);
  camera.position.set(10.5, 8.6, 11.5);
  camera.lookAt(TARGET);
  // 縦長の画面（スマホ）でも部屋全体が入るよう、カメラの距離を画面の形に合わせる
  var BASE_DIST = camera.position.distanceTo(TARGET);
  function fitDistance() {
    var a = window.innerWidth / window.innerHeight;
    return BASE_DIST * (a < 1.3 ? Math.pow(1.3 / a, 0.85) : 1);
  }
  camera.position.sub(TARGET).setLength(fitDistance()).add(TARGET);

  // トゥーン調の陰影（3段階）
  var gradTex = (function () {
    var data = new Uint8Array([150, 150, 150, 210, 210, 210, 255, 255, 255]);
    var t = new THREE.DataTexture(data, 3, 1, THREE.RGBFormat);
    t.minFilter = t.magFilter = THREE.NearestFilter; t.generateMipmaps = false; t.needsUpdate = true;
    return t;
  })();
  var matCache = {};
  function toon(color, extra) {
    var key = color + (extra ? JSON.stringify(extra) : "");
    if (!matCache[key]) {
      var o = { color: new THREE.Color(color), gradientMap: gradTex };
      if (extra) for (var p in extra) o[p] = extra[p];
      matCache[key] = new THREE.MeshToonMaterial(o);
    }
    return matCache[key];
  }
  function mesh(geo, mat, x, y, z, parent) {
    var m = new THREE.Mesh(geo, mat);

    var arm = cyl(0.015, 0.015, 0.34, "#1f2328", sx * 0.42, 0.33, 0.2, head, 8); arm.rotation.x = Math.PI / 2;

  var bridge = cyl(0.018, 0.018, 0.2, "#1f2328", 0, 0.36, 0.37, head, 8); bridge.rotation.z = Math.PI / 2;
  // 横に広い口（にっこり／困り）
  var mouth = mesh(new THREE.TorusGeometry(0.2, 0.016, 8, 28, Math.PI), toon(DARK), 0, 0.02, 0.38, head);
  mouth.rotation.z = Math.PI; mouth.scale.y = 0.45;
  // 汗（困ったとき）
  var sweat = new THREE.Group(); sweat.position.set(0.55, 0.25, 0.15); head.add(sweat);
  var drop = new THREE.Mesh(new THREE.SphereGeometry(0.06, 16, 12), new THREE.MeshToonMaterial({ color: 0x9fd6f5, gradientMap: gradTex }));
  sweat.add(drop);
  var tip = new THREE.Mesh(new THREE.ConeGeometry(0.058, 0.1, 16), drop.material); tip.position.y = 0.07; sweat.add(tip);
  sweat.visible = false;
  // 腕（キーボードを打つ）
  var arms = [];
  [-1, 1].forEach(function (sx) {
    var pivot = new THREE.Group(); pivot.position.set(sx * 0.38, 0.62, 0.06); torso.add(pivot);
    cyl(0.075, 0.075, 0.5, GREEN, 0, -0.25, 0, pivot, 14);
    ball(0.09, LIGHT, 0, -0.5, 0, pivot);
    [-1, 0, 1].forEach(function (k) { ball(0.04, LIGHT, k * 0.06, -0.58, 0.02, pivot); });
    pivot.rotation.x = -1.15; pivot.rotation.z = sx * 0.12;
    arms.push(pivot);
  });
  chara.traverse(function (o) { if (o.isMesh) { o.userData.action = "id"; clickables.push(o); } });

  // 今日の状態をオフィスの様子で見せる
  var emptyEmpSign = null, okSign = null;
  if (state === "before") {
    chara.visible = false;
    chara.traverse(function (o) { var ix = clickables.indexOf(o); if (ix >= 0) clickables.splice(ix, 1); });
    emptyEmpSign = makeSign("出社前", "#f6d58a", "#7a5236", 0.9);
    emptyEmpSign.position.set(0.55, 0.93, 0.25); emptyEmpSign.rotation.y = -0.2; empDesk.add(emptyEmpSign);
    // 出社前でも空席の札をクリックすると社員証が見られる
    emptyEmpSign.traverse(function (o) { if (o.isMesh) { o.userData.action = "id"; clickables.push(o); } });
  }
  if (state === "no_news") {
    okSign = makeSign("異常なし", "#8fd4bd", "#ffffff", 0.95);
    okSign.position.set(-0.75, 0.93, 0.3); okSign.rotation.y = 0.2; empDesk.add(okSign);
  }
  if (state === "search_failed") {
    sweat.visible = true;
    mouth.rotation.z = 0; mouth.position.y = -0.06; mouth.scale.set(0.6, 0.35, 1);
    brows[0].rotation.z = -0.45; brows[1].rotation.z = 0.45;
    empLaptop.screen.material.color.set(0xf4b6ae);
  }

  /* ---- 光 ---- */
  var hemi = new THREE.HemisphereLight(0xfff6e8, 0xd9b48f, 0.55); scene.add(hemi);
  var sunLight = new THREE.DirectionalLight(0xfff1dc, 0.75);
  sunLight.position.set(-8, 12, 6); sunLight.castShadow = true;
  sunLight.shadow.mapSize.set(2048, 2048);
  var sc = sunLight.shadow.camera; sc.left = -9; sc.right = 9; sc.top = 9; sc.bottom = -9; sc.near = 1; sc.far = 40;
  sunLight.shadow.bias = -0.0008;
  scene.add(sunLight);
  var fill = new THREE.DirectionalLight(0xffe2c4, 0.2); fill.position.set(10, 8, 10); scene.add(fill);
  var lamp = new THREE.PointLight(0xffc98a, 0, 10); lamp.position.set(-0.6, 2.4, -1.8); scene.add(lamp);
  // 社長の机のデスクライト
  var deskLamp = new THREE.Group(); deskLamp.position.set(-1.1, 0.93, -0.35); presDesk.add(deskLamp);
  cyl(0.14, 0.16, 0.05, "#8fd4bd", 0, 0.025, 0, deskLamp, 20);
  var lampArm = cyl(0.025, 0.025, 0.6, "#8fd4bd", 0, 0.3, 0, deskLamp, 8);
  var shade = mesh(new THREE.ConeGeometry(0.2, 0.22, 20, 1, true), toon("#8fd4bd", { side: THREE.DoubleSide }), 0.12, 0.62, 0.06, deskLamp);
  shade.rotation.z = -0.5;
  var bulb = new THREE.Mesh(new THREE.SphereGeometry(0.08, 16, 12), new THREE.MeshBasicMaterial({ color: 0xfff1cc })); bulb.position.set(0.15, 0.56, 0.06); deskLamp.add(bulb);

  /* ---- 時間帯（日本時間）で空の色を変える ---- */
  var PHASES = {
    morning: { top: "#ffd8b0", bottom: "#fff3d6", sun: 0xffe7a0, sunY: 0.0, light: 0.42, hemi: 0.48, lamp: 0, stars: false },
    day:     { top: "#7cc6f2", bottom: "#d8f0ff", sun: 0xfff1a8, sunY: 0.45, light: 0.45, hemi: 0.5, lamp: 0, stars: false },
    evening: { top: "#f49a7c", bottom: "#ffd7a1", sun: 0xff9b6a, sunY: -0.2, light: 0.36, hemi: 0.45, lamp: 0.4, stars: false },
    night:   { top: "#26305e", bottom: "#4f5b93", sun: 0xf7f3d0, sunY: 0.4, light: 0.15, hemi: 0.4, lamp: 1.1, stars: true }
  };
  var currentPhase = null;
  function phaseOf(h) { return h >= 5 && h < 10 ? "morning" : h >= 10 && h < 16 ? "day" : h >= 16 && h < 19 ? "evening" : "night"; }
  function applyPhase(name) {
    if (name === currentPhase) return; currentPhase = name;
    var P = PHASES[name], g = skyCanvas.getContext("2d");
    var gr = g.createLinearGradient(0, 0, 0, 256); gr.addColorStop(0, P.top); gr.addColorStop(1, P.bottom);
    g.fillStyle = gr; g.fillRect(0, 0, 256, 256);
    if (P.stars) { g.fillStyle = "#fffbe0"; for (var s = 0; s < 40; s++) { g.beginPath(); g.arc(Math.random() * 256, Math.random() * 170, Math.random() * 1.6 + 0.4, 0, 7); g.fill(); } }
    skyTex.needsUpdate = true;
    sun.material.color.set(P.sun); sun.position.y = WIN_Y + P.sunY;
    if (name === "night") { sun.scale.setScalar(0.8); } else { sun.scale.setScalar(1); }
    clouds.visible = name !== "night";
    hill.material.color.set(name === "night" ? 0x3f5a6e : name === "evening" ? 0xc9a882 : 0x9fd8a8);
    sunLight.intensity = P.light; hemi.intensity = P.hemi; lamp.intensity = P.lamp;
    bulb.material.color.set(P.lamp > 0 ? 0xffe2a0 : 0xfff6e6);
    document.body.style.background = name === "night"
      ? "radial-gradient(circle at 30% 20%, #4a4f78, #262a48 70%)"
      : name === "evening" ? "radial-gradient(circle at 30% 20%, #ffe3cc, #f2b99a 70%)"
      : "radial-gradient(circle at 30% 20%, #fff3e2, #f6dcc0 70%)";
  }
  function updateClock() {
    var n = jstNow();
    var hh = n.getUTCHours(), mm = n.getUTCMinutes(), ss = n.getUTCSeconds() + n.getUTCMilliseconds() / 1000;
    secHand.rotation.z = -ss / 60 * Math.PI * 2;
    minHand.rotation.z = -(mm + ss / 60) / 60 * Math.PI * 2;
    hourHand.rotation.z = -((hh % 12) + mm / 60) / 12 * Math.PI * 2;
    applyPhase(phaseOf(hh));
  }

  /* ---- 操作（ドラッグで回転・ホイールで拡大・自動でゆっくり回る） ---- */
  var controls = null, idleUntil = 0, sph = null;
  if (THREE.OrbitControls) {
    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.target.copy(TARGET);
    controls.enableDamping = true; controls.dampingFactor = 0.08;
    controls.enablePan = false;
    controls.minDistance = 8; controls.maxDistance = Math.max(32, fitDistance() * 1.5);
    controls.minPolarAngle = 0.25; controls.maxPolarAngle = 1.3;
    controls.autoRotate = true; controls.autoRotateSpeed = 0.5;
    controls.addEventListener("start", function () { controls.autoRotate = false; idleUntil = Infinity; });
    controls.addEventListener("end", function () { idleUntil = performance.now() + 5000; });
    controls.update();
  } else {
    // OrbitControls が読み込めなかったときの簡易操作（同じ動き）
    sph = new THREE.Spherical().setFromVector3(camera.position.clone().sub(TARGET));
    var dragging = false, lx = 0, ly = 0;
    renderer.domElement.addEventListener("pointerdown", function (e) { dragging = true; lx = e.clientX; ly = e.clientY; idleUntil = Infinity; });
    window.addEventListener("pointerup", function () { if (dragging) { dragging = false; idleUntil = performance.now() + 5000; } });
    window.addEventListener("pointermove", function (e) {
      if (!dragging) return;
      sph.theta -= (e.clientX - lx) * 0.008; sph.phi -= (e.clientY - ly) * 0.008; lx = e.clientX; ly = e.clientY;
      sph.phi = Math.max(0.25, Math.min(1.3, sph.phi));
    });
    renderer.domElement.addEventListener("wheel", function (e) {
      e.preventDefault(); sph.radius = Math.max(8, Math.min(Math.max(32, fitDistance() * 1.5), sph.radius * (1 + Math.sign(e.deltaY) * 0.08)));
    }, { passive: false });
    controls = {
      update: function () {
        if (!dragging && performance.now() > idleUntil) sph.theta += 0.0012;
        camera.position.copy(new THREE.Vector3().setFromSpherical(sph).add(TARGET)); camera.lookAt(TARGET);
      }
    };
  }

  /* ---- クリック ---- */
  var ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), downAt = null, hovered = null;
  function pick(e) {
    var r = renderer.domElement.getBoundingClientRect();
    ndc.x = ((e.clientX - r.left) / r.width) * 2 - 1; ndc.y = -((e.clientY - r.top) / r.height) * 2 + 1;
    ray.setFromCamera(ndc, camera);
    var hits = ray.intersectObjects(clickables.filter(function (o) { var v = true; o.traverseAncestors(function (a) { if (!a.visible) v = false; }); return v && (o.visible || o === trayHit); }), false);
    return hits.length ? hits[0].object.userData.action : null;
  }
  renderer.domElement.addEventListener("pointerdown", function (e) { downAt = { x: e.clientX, y: e.clientY }; });
  renderer.domElement.addEventListener("pointerup", function (e) {
    if (!downAt || Math.hypot(e.clientX - downAt.x, e.clientY - downAt.y) > 6) return;
    var act = pick(e);
    if (act === "news") openModal("news-modal");
    if (act === "id") openModal("id-modal");
  });
  renderer.domElement.addEventListener("pointermove", function (e) {
    var act = pick(e); hovered = act;
    renderer.domElement.style.cursor = act ? "pointer" : "grab";
  });

  /* ---- 名札・吹き出しの位置 ---- */
  var tmp = new THREE.Vector3();
  function placeTag(el, obj, offY, show) {
    if (!show) { el.style.opacity = "0"; return; }
    obj.getWorldPosition(tmp); tmp.y += offY; tmp.project(camera);
    if (tmp.z > 1) { el.style.opacity = "0"; return; }
    el.style.left = ((tmp.x + 1) / 2 * window.innerWidth) + "px";
    // 吹き出しは名札のすぐ上に置く
    el.style.top = ((1 - tmp.y) / 2 * window.innerHeight - (el === bubble ? nametag.offsetHeight + 10 : 0)) + "px";
    el.style.opacity = "1";
    if (el === bubble) {
      var x = (tmp.x + 1) / 2 * window.innerWidth;
      el.classList.toggle("flip", x + el.offsetWidth * 1.1 > window.innerWidth - 8);
    }
  }

  /* ---- 動き ---- */
  var clockT = new THREE.Clock(), nextBlink = 1.5, blinkEnd = 0;
  var typingSpeed = state === "reported" ? 14 : state === "no_news" ? 6 : 0;
  function animate() {
    requestAnimationFrame(animate);
    var t = clockT.getElapsedTime();

    if (controls.autoRotate === false && performance.now() > idleUntil) controls.autoRotate = true;
    controls.update();

    // 視点が壁の外側に回ったら、その壁を隠して中が見えるようにする
    backWall.visible = camera.position.z > -D / 2 + 0.5;
    leftWall.visible = camera.position.x > -W / 2 + 0.5;

    if (chara.visible) {
      // キーボード
      if (typingSpeed) {
        arms[0].rotation.x = -1.15 + Math.sin(t * typingSpeed) * 0.09;
        arms[1].rotation.x = -1.15 + Math.sin(t * typingSpeed + Math.PI) * 0.09;
      } else {
        arms[0].rotation.x = arms[1].rotation.x = -0.9;
      }
      // 頭と体
      if (state === "search_failed") {
        head.rotation.z = 0.18 + Math.sin(t * 1.2) * 0.04; head.rotation.x = 0.12;
        sweat.position.y = 0.2 - (t * 0.25 % 0.2);
      } else {
        head.rotation.z = Math.sin(t * 1.6) * 0.05; head.rotation.x = Math.sin(t * 0.8) * 0.03 + 0.05;
      }
      torso.position.y = Math.abs(Math.sin(t * (typingSpeed || 2) / 2)) * 0.015;
      var puff = 1 + Math.max(0, Math.sin(t * (state === "search_failed" ? 1.5 : 3))) * 0.18;
      throat.scale.set(1.1 * puff, 0.7 * puff, 0.8 * puff);
      // まばたき
      if (t > nextBlink) { blinkEnd = t + 0.13; nextBlink = t + 2.2 + Math.random() * 2.8; }
      var sy = t < blinkEnd ? 0.12 : 1;
      eyes[0].scale.y = eyes[1].scale.y = sy;
    }
    // 報告書の目印
    if (marker.children.length) {
      marker.position.y = 1.45 + count * 0.07 + Math.sin(t * 3) * 0.06;
      marker.rotation.y = t * 1.5;
    }
    paperMat.emissive.setHex(hovered === "news" ? 0x332211 : 0x000000);
    if (state !== "before") empLaptop.screen.material.color.offsetHSL(0, 0, 0);
    plants.forEach(function (p, idx) { p.rotation.z = Math.sin(t * 0.9 + idx) * 0.015; });

    updateClock();
    renderer.render(scene, camera);
    placeTag(nametag, head, 0.85, chara.visible);
    placeTag(bubble, head, 0.85, chara.visible && !!speech);
  }
  animate();

  window.addEventListener("resize", function () {
    camera.aspect = window.innerWidth / window.innerHeight; camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
    if (controls.object) { controls.maxDistance = Math.max(32, fitDistance() * 1.5); camera.position.sub(controls.target).setLength(fitDistance()).add(controls.target); }
    else if (sph) sph.radius = fitDistance();
  });
})();
</script>
</body>
</html>
